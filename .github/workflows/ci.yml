name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Lint, Test & E2E
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Build Backend
        working-directory: ./backend
        run: npm run build

      - name: Run Backend Unit Tests
        working-directory: ./backend
        run: npm run test

      - name: Run Backend E2E & Concurrency Tests
        working-directory: ./backend
        env:
          NODE_ENV: test
          PORT: 3000
          MONGODB_URI: mongodb://localhost:27017/easygenerator_auth_test
          JWT_SECRET: ci-pipeline-super-secret-jwt-token-key-2026!
          JWT_EXPIRES_IN: 15m
          JWT_REFRESH_SECRET: ci-pipeline-refresh-secret-jwt-token-key-2026!
          AUTH_COOKIE_NAME: eg_auth_token
          COOKIE_SECRET: ci-pipeline-cookie-signer-secret-2026
        run: npm run test:e2e

  frontend-test:
    name: Frontend Typecheck, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Frontend Tests
        working-directory: ./frontend
        run: npm run test

      - name: Build Frontend Application
        working-directory: ./frontend
        run: npm run build
