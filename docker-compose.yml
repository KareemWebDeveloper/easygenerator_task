services:
  mongodb:
    image: mongo:8.0
    container_name: easygenerator-mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: easygenerator_auth
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: easygenerator-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/easygenerator_auth
      FRONTEND_URL: http://localhost:8080
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in a root .env file (see .env.example)}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in a root .env file (see .env.example)}
      AUTH_COOKIE_NAME: eg_auth_token
      COOKIE_SECRET: ${COOKIE_SECRET:?Set COOKIE_SECRET in a root .env file (see .env.example)}
      THROTTLE_TTL: 60000
      THROTTLE_LIMIT: 20
    ports:
      - "3000:3000"
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: easygenerator-frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongo_data:
